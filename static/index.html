<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Macros">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json?token=__TOKEN__">
<title>Macro Pad</title>
<style>
  :root { color-scheme: dark; --pad: 16px; --gap: 12px; --cols: 2; --rows: 4; }
  /* Portrait: 2 across the short edge, 4 down the long edge. Landscape reflows to 4 x 2 so it
     is still 2 along the short edge and 4 along the long edge. The pad never rotates. */
  @media (orientation: landscape) { :root { --cols: 4; --rows: 2; } }
  /* .flip: pad rotated 180 degrees for a phone held upside down (long-press anywhere). Insets swap because the
     rotation is applied to the body after its padding. */
  html.flip body { transform: rotate(180deg);
         padding: max(var(--pad), env(safe-area-inset-bottom)) max(var(--pad), env(safe-area-inset-left))
                  max(var(--pad), env(safe-area-inset-top)) max(var(--pad), env(safe-area-inset-right)); }
  html.flip #toast { bottom: auto; top: max(30px, env(safe-area-inset-bottom)); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { margin: 0; color: #fff; font-family: -apple-system, system-ui, sans-serif; background: #0c0c0e;
         height: 100dvh; touch-action: manipulation; -webkit-user-select: none; user-select: none;
         padding: max(var(--pad), env(safe-area-inset-top)) max(var(--pad), env(safe-area-inset-right))
                  max(var(--pad), env(safe-area-inset-bottom)) max(var(--pad), env(safe-area-inset-left));
         display: grid; place-content: center; }
  #grid { --w: calc(100vw - max(var(--pad), env(safe-area-inset-left)) - max(var(--pad), env(safe-area-inset-right)));
          --h: calc(100dvh - max(var(--pad), env(safe-area-inset-top)) - max(var(--pad), env(safe-area-inset-bottom)));
          --s: min(calc((var(--w) - (var(--cols) - 1) * var(--gap)) / var(--cols)),
                   calc((var(--h) - (var(--rows) - 1) * var(--gap)) / var(--rows)));
          display: grid; grid-template-columns: repeat(var(--cols), var(--s));
          grid-template-rows: repeat(var(--rows), var(--s)); gap: var(--gap); }
  button { width: var(--s); height: var(--s); min-height: 0; border: 0; border-radius: calc(var(--s) * .16);
           color: #fff; font: inherit; display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: calc(var(--s) * .07); padding: calc(var(--s) * .06);
           background: #2a2a2f;
           box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 0 1px rgba(255,255,255,.04),
                       0 8px 18px rgba(0,0,0,.55), 0 2px 4px rgba(0,0,0,.5);
           transition: background-color .25s, box-shadow .12s, transform .12s; }
  button:active { background: #36363c; transform: translateY(2px) scale(.97);
           box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 2px 5px rgba(0,0,0,.5); }
  button.ok { background: #4caf50; }
  button.empty { background: rgba(255,255,255,.03); box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); pointer-events: none; }
  .icon { width: calc(var(--s) * .36); height: calc(var(--s) * .36); color: #fff; }
  .icon svg { width: 100%; height: 100%; display: block; fill: none; stroke: currentColor;
              stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .icon svg .f { fill: currentColor; stroke: none; }
  .label { font-size: clamp(11px, calc(var(--s) * .095), 17px); font-weight: 600; letter-spacing: -.01em;
           line-height: 1.15; text-align: center; opacity: .92; max-width: 100%;
           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #toast { position: fixed; left: 50%; bottom: max(30px, env(safe-area-inset-bottom)); transform: translateX(-50%);
           background: #4caf50; padding: 12px 20px; border-radius: 999px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.err { background: #c62828; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<script>
// Apply the saved flip before first paint.
try { if (localStorage.getItem("flip") === "1") document.documentElement.classList.add("flip"); } catch (e) {}
</script>
<div id="grid"></div>
<div id="toast"></div>
<script>
const TOKEN = "__TOKEN__";
const H = { "X-Token": TOKEN };
const toast = document.getElementById("toast");
let timer;
function show(msg, err) {
  toast.textContent = msg;
  toast.className = "show" + (err ? " err" : "");
  clearTimeout(timer);
  timer = setTimeout(() => toast.className = "", 1500);
}
// SF Symbols can't be used on the web (Apple's licence and no web font), so these are
// hand-drawn lookalikes keyed by SF Symbol name. Set `icon:` in actions.yaml to one of these.
const ICONS = {
  "chart.bar.fill": '<rect class="f" x="4" y="12" width="4" height="8" rx="1"/><rect class="f" x="10" y="4" width="4" height="16" rx="1"/><rect class="f" x="16" y="9" width="4" height="11" rx="1"/>',
  "display": '<rect x="3" y="4" width="18" height="12.5" rx="2"/><path d="M8 20.5h8M12 16.5v4"/>',
  "laptopcomputer": '<rect x="5" y="5" width="14" height="10" rx="1.6"/><path d="M2.5 19h19"/>',
  "chart.line.uptrend.xyaxis": '<path d="M4 4v16h16"/><path d="M7.5 15l3.5-4 3 3 5-6"/><path d="M15.5 8h3.5v3.5"/>',
  "globe": '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3.2 3 3.2 15 0 18-3.2-3-3.2-15 0-18z"/>',
  "calendar": '<rect x="4" y="5" width="16" height="15" rx="2.2"/><path d="M4 10h16M8 3v4M16 3v4"/>',
  "music.note": '<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
  "moon.fill": '<path class="f" d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>',
  "play.fill": '<path class="f" d="M7 4.5v15l12-7.5z"/>',
};
function icon(name) {
  return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || ICONS["play.fill"]) + "</svg>";
}
let audio;
function pop() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
    o.frequency.setValueAtTime(700, t);
    o.frequency.exponentialRampToValueAtTime(150, t + 0.08);
    g.gain.setValueAtTime(0.4, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    o.connect(g).connect(audio.destination);
    o.start(t);
    o.stop(t + 0.1);
  } catch (e) {}
}
function flash(btn) {
  btn.classList.add("ok");
  clearTimeout(btn._t);
  btn._t = setTimeout(() => btn.classList.remove("ok"), 500);
}
async function run(a, btn) {
  try {
    const r = await fetch("/run/" + encodeURIComponent(a.id), { method: "POST", headers: H });
    if (r.ok) flash(btn); else show("Error: " + ((await r.json()).detail || r.status), true);
  } catch (e) { show("Can't reach Mac", true); }
}
async function load() {
  try {
    const actions = await (await fetch("/api/actions", { headers: H })).json();
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    for (let i = 0; i < 8; i++) {  // fixed 2x4 grid; unused slots stay as empty placeholders
      const a = actions[i];
      const b = document.createElement("button");
      if (!a) { b.className = "empty"; b.disabled = true; grid.appendChild(b); continue; }
      b.innerHTML = '<span class="icon"></span><span class="label"></span>';
      b.children[0].innerHTML = icon(a.icon);
      b.children[1].textContent = a.label;
      b.onclick = () => { pop(); run(a, b); };
      grid.appendChild(b);
    }
  } catch (e) { show("Can't reach Mac", true); }
}
load();

// Holding anywhere (tiles included) for 1 second toggles the 180-degree flip and remembers it.
let lp, lpFired = false, lpX = 0, lpY = 0;
function cancelLP() { clearTimeout(lp); }
document.addEventListener("pointerdown", (e) => {
  lpFired = false; lpX = e.clientX; lpY = e.clientY;
  lp = setTimeout(() => {
    lpFired = true;
    const on = document.documentElement.classList.toggle("flip");
    try { localStorage.setItem("flip", on ? "1" : "0"); } catch (err) {}
  }, 1000);
});
document.addEventListener("pointermove", (e) => {
  if (Math.hypot(e.clientX - lpX, e.clientY - lpY) > 12) cancelLP();  // tolerate finger jitter
});
for (const ev of ["pointerup", "pointercancel"]) document.addEventListener(ev, cancelLP);
// A hold that flipped the pad must not also run the tile under the finger on release.
document.addEventListener("click", (e) => {
  if (lpFired) { e.stopPropagation(); e.preventDefault(); lpFired = false; }
}, true);
document.addEventListener("contextmenu", (e) => e.preventDefault());
</script>
</body>
</html>
