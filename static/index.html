<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Macros">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json?token=__TOKEN__">
<title>Macro Pad</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { margin: 0; background: #111; color: #fff; font-family: -apple-system, system-ui, sans-serif;
         height: 100dvh; touch-action: manipulation;
         padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
          grid-auto-rows: minmax(0, 1fr); gap: 12px; height: 100%; }
  button { min-height: 0; border: 0; border-radius: 20px; background: #2a2a2e; color: #fff;
           font-size: 16px; display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 8px; padding: 8px; }
  button { transition: background-color .25s; }
  button.ok { background: #2e7d32; }
  button:active { background: #3d3d44; transform: scale(.97); }
  .icon { font-size: 44px; }
  #toast { position: fixed; left: 50%; bottom: max(30px, env(safe-area-inset-bottom)); transform: translateX(-50%);
           background: #2e7d32; padding: 12px 20px; border-radius: 999px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.err { background: #c62828; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="grid"></div>
<div id="toast"></div>
<script>
const TOKEN = "__TOKEN__";
const H = { "X-Token": TOKEN };
const toast = document.getElementById("toast");
let timer;
function show(msg, err) {
  toast.textContent = msg;
  toast.className = "show" + (err ? " err" : "");
  clearTimeout(timer);
  timer = setTimeout(() => toast.className = "", 1500);
}
let audio;
function pop() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
    o.frequency.setValueAtTime(700, t);
    o.frequency.exponentialRampToValueAtTime(150, t + 0.08);
    g.gain.setValueAtTime(0.4, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    o.connect(g).connect(audio.destination);
    o.start(t);
    o.stop(t + 0.1);
  } catch (e) {}
}
function flash(btn) {
  btn.classList.add("ok");
  clearTimeout(btn._t);
  btn._t = setTimeout(() => btn.classList.remove("ok"), 500);
}
async function run(a, btn) {
  try {
    const r = await fetch("/run/" + encodeURIComponent(a.id), { method: "POST", headers: H });
    if (r.ok) flash(btn); else show("Error: " + ((await r.json()).detail || r.status), true);
  } catch (e) { show("Can't reach Mac", true); }
}
async function load() {
  try {
    const actions = await (await fetch("/api/actions", { headers: H })).json();
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    for (const a of actions) {
      const b = document.createElement("button");
      b.innerHTML = '<span class="icon"></span><span></span>';
      b.children[0].textContent = a.icon;
      b.children[1].textContent = a.label;
      b.onclick = () => { pop(); run(a, b); };
      grid.appendChild(b);
    }
  } catch (e) { show("Can't reach Mac", true); }
}
load();
</script>
</body>
</html>
